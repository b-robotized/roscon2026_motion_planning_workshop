---
name: Build and publish Docker Image

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.docker/**'
      - '.github/workflows/build_and_publish_docker.yaml'
  push:
    branches:
      - master
    paths:
      - '.docker/**'
      - '.github/workflows/build_and_publish_docker.yaml'

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/roscon2026-motion-planning-workshop

jobs:
  # Fork pull requests only get a read-only GITHUB_TOKEN, so they cannot push.
  config:
    runs-on: ubuntu-latest
    outputs:
      push: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
      tag: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'latest' }}
    steps:
      - run: echo "tag=${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'latest' }}"

  build_images:
    needs: config
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    permissions:
      contents: read
      packages: write
    steps:
      - name: Set platform slug
        run: echo "PLATFORM_PAIR=${PLATFORM//\//-}" >> "$GITHUB_ENV"
        env:
          PLATFORM: ${{ matrix.platform }}
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: .docker/Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=min,scope=${{ env.PLATFORM_PAIR }}
          outputs: >-
            ${{ needs.config.outputs.push == 'true'
                && format('type=image,name={0},push-by-digest=true,name-canonical=true,push=true', env.IMAGE_NAME)
                || 'type=cacheonly' }}
      - name: Export digest
        if: needs.config.outputs.push == 'true'
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          touch "${{ runner.temp }}/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        if: needs.config.outputs.push == 'true'
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  publish_manifest:
    needs: [config, build_images]
    if: needs.config.outputs.push == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      IMAGE_TAG: ${{ needs.config.outputs.tag }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create and push manifest list
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create -t "${IMAGE_NAME}:${IMAGE_TAG}" \
            $(printf "${IMAGE_NAME}@sha256:%s " *)
      - name: Inspect manifest list
        run: docker buildx imagetools inspect "${IMAGE_NAME}:${IMAGE_TAG}"
